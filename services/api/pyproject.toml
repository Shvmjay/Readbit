[project]
name = "readbit-api"
version = "0.1.0"
description = "Readbit API: document ingestion, grounded summarization, book Q&A and adaptive quizzes."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "defusedxml>=0.7",
  "argon2-cffi>=23.1",
  "celery>=5.4",
  "redis>=5.0",
  "boto3>=1.34",
  "anthropic>=1.0",
  "httpx>=0.27",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "reportlab>=4.2",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::bs4.XMLParsedAsHTMLWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101", "B008", "S311", "E501", "UP046", "UP047", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"app/evaluations/*" = ["S"]
"app/document_processing/pdf.py" = ["B023"]  # line-handling closures run within the same iteration

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
